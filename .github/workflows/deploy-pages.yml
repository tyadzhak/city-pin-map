name: Deploy to GitHub Pages

# Free for public repos: GitHub Actions standard runners are unmetered for
# public repositories, and GitHub Pages itself is free for public repos.
# Keep this repository public to keep both costs at zero.
#
# Security note: this workflow does NOT consume any untrusted github.event
# inputs (issue titles, PR bodies, commit messages, etc.) in run: blocks.
# The only ${{ }} expressions read outputs of the official
# actions/deploy-pages action (`page_url` as a UI display URL, `outcome`
# as a step condition) — never interpolated into shell commands.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by actions/deploy-pages@v5 (OIDC token + Pages write).
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment runs at a time. We don't cancel in-progress runs
# so a fast follow-up push doesn't abort the deploy that's almost done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Stage only the web-app files. The repo also contains design docs
      # (jira/, docs/, spikes/, *.md) that don't need to be served at the
      # Pages URL — they remain visible on github.com but not at the
      # deployed origin. Keeps the artifact small and the served surface
      # clean.
      - name: Stage site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css _site/
          cp -r js _site/
          cp -r assets _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploy is its own job rather than a step right after the upload: run
  # 44770858332 failed because deploy-pages looked the artifact up 0.4s
  # after upload-pages-artifact finished, before GitHub's artifact listing
  # had caught up ("Found 0 artifact(s)"). The job boundary gives the
  # listing time to settle, and "Re-run failed jobs" then retries only the
  # deploy against the already-uploaded artifact.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # deploy-pages@v5 backs off while polling deployment status but not on
      # the initial artifact lookup, so one transient API miss there fails
      # the run. Tolerate one failed attempt, wait, and try once more; a
      # second failure still fails the job.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
